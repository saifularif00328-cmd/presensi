<header class="atas">
  <h1 id="sekolah">Layar Gerbang</h1>
  <span id="status" class="status off">Menghubungkan…</span>
  <button id="t-suara" type="button"></button>
  <button id="t-mode" type="button"></button>
  <button id="t-layar" type="button">⛶ Layar penuh</button>
  <span id="jam"></span>
</header>
<div id="peringatan" hidden></div>
<main id="panel"></main>
<div id="mulai"><div><button type="button">▶ Mulai layar gerbang</button>
  <p>Klik sekali agar suara bisa diputar (aturan browser).</p></div></div>
<div id="dialog" hidden><div class="kotak-dialog">
  <h3>Scanner baru terdeteksi</h3>
  <p>Alat <b class="sc-label"></b> (<span class="sc-jenis"></span>) baru saja dipakai scan.
    Pasang di gerbang mana? Scan itu akan diproses setelah dipilih.</p>
  <div class="pilihan"></div>
  <button type="button" class="abaikan">Abaikan — ini keyboard biasa, bukan scanner</button>
</div></div>

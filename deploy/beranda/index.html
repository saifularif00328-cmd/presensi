<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presensiku — Presensi Siswa Digital</title>
  <style>
    :root { --p: #1d4ed8; --t: #101828; --m: #667085; --b: #e4e7ec; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--t);
      background: linear-gradient(160deg, #eff4ff, #f5f6f8 55%); padding: 16px; }
    .kartu { background: #fff; border: 1px solid var(--b); border-radius: 16px; padding: 32px 28px;
      width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(16, 24, 40, .08); }
    .logo { width: 48px; height: 48px; border-radius: 12px; background: var(--p); display: grid; place-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.45rem; margin: 0 0 6px; }
    p { color: var(--m); margin: 0 0 22px; line-height: 1.5; }
    label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: 6px; }
    .baris { display: flex; align-items: center; border: 1px solid #d0d5dd; border-radius: 10px; overflow: hidden; }
    .baris span { padding: 12px 0 12px 12px; color: var(--m); white-space: nowrap; font-size: .95rem; }
    input { border: 0; outline: 0; padding: 12px 12px 12px 2px; font-size: 1rem; flex: 1; min-width: 0; }
    .baris:focus-within { border-color: var(--p); box-shadow: 0 0 0 3px #c7d7fe; }
    .tombol { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; border: 0; border-radius: 10px; padding: 12px; font-size: .95rem; font-weight: 600; cursor: pointer; }
    .utama { background: var(--p); color: #fff; }
    .kedua { background: #eff4ff; color: var(--p); }
    small { display: block; margin-top: 18px; color: var(--m); text-align: center; }
  </style>
</head>
<body>
  <main class="kartu">
    <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg></div>
    <h1>Presensi Siswa Digital</h1>
    <p>Masukkan kode sekolah Anda (tertulis di surat edaran / slip PIN dari sekolah).</p>
    <form id="f">
      <label for="kode">Kode sekolah</label>
      <div class="baris"><span>presensiku.biz.id/</span><input id="kode" placeholder="smpn1" autocomplete="off" autocapitalize="none" required></div>
      <div class="tombol">
        <button type="submit" class="utama" data-tujuan="portal/masuk">Orang tua / siswa</button>
        <button type="submit" class="kedua" data-tujuan="login">Guru / admin</button>
      </div>
    </form>
    <small>Presensiku · kartu RFID, QR, dan portal orang tua</small>
  </main>
  <script>
    var tujuan = 'portal/masuk';
    document.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () { tujuan = b.dataset.tujuan; });
    });
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var kode = document.getElementById('kode').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (kode) location.href = '/' + kode + '/' + tujuan;
    });
  </script>
</body>
</html>

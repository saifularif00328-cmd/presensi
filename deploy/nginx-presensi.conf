# Nginx: semua sekolah di satu domain, dipilih berdasarkan jalur:
#   https://presensiku.biz.id/smpn1/...  -> layanan presensi@smpn1 (port 7001)
#   https://presensiku.biz.id/smpn2/...  -> layanan presensi@smpn2 (port 7002)
# Hanya mendengar di 127.0.0.1:8080 — akses internet lewat Cloudflare Tunnel (cloudflared),
# sehingga VPS tidak membuka port web sama sekali.
# Blok per sekolah ada di /etc/nginx/presensi-sekolah.conf (dikelola tools/sekolah.py).

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    client_max_body_size 16m;
    absolute_redirect off;          # Location relatif (tanpa :8080) karena diakses lewat Cloudflare

    # halaman depan + pendaftaran demo (daftar/, layanan presensi-daftar :7000)
    location = / { proxy_pass http://127.0.0.1:7000; include /etc/nginx/presensi-proxy.conf; }
    location ^~ /daftar { proxy_pass http://127.0.0.1:7000; include /etc/nginx/presensi-proxy.conf; }
    location = /cek-kode { proxy_pass http://127.0.0.1:7000; include /etc/nginx/presensi-proxy.conf; }
    # unduhan publik: installer Presensiku Pos + pos-versi.json (presensi-sekolah pasang-pos)
    location ^~ /unduh/ { alias /srv/presensi/_unduh/; autoindex off; add_header Cache-Control "no-cache"; }
    location = /sehat { proxy_pass http://127.0.0.1:7000; include /etc/nginx/presensi-proxy.conf; }
    location = /privasi { proxy_pass http://127.0.0.1:7000; include /etc/nginx/presensi-proxy.conf; }
    location = /syarat { proxy_pass http://127.0.0.1:7000; include /etc/nginx/presensi-proxy.conf; }
    location = /harga { proxy_pass http://127.0.0.1:7000; include /etc/nginx/presensi-proxy.conf; }
    location = /panduan { proxy_pass http://127.0.0.1:7000; include /etc/nginx/presensi-proxy.conf; }
    # panel pribadi vendor (password + Google Authenticator)
    location ^~ /vendor { proxy_pass http://127.0.0.1:7000; include /etc/nginx/presensi-proxy.conf; }
    location = /favicon.ico { return 204; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\n"; }

    # halaman ramah bila layanan sekolah sedang dimulai ulang
    error_page 502 503 504 /_offline.html;
    location = /_offline.html {
        internal;
        default_type text/html;
        return 200 '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font-family:sans-serif;text-align:center;padding:3rem;color:#344054"><h2>Server sedang dimulai ulang</h2><p>Silakan coba lagi dalam 1 menit.</p></body>';
    }

    include /etc/nginx/presensi-sekolah.conf;

    location / { return 404; }
}

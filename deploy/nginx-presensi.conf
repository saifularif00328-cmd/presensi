# Nginx: satu pintu untuk semua sekolah, dipilih berdasarkan subdomain.
# Hanya mendengar di 127.0.0.1:8080 — akses internet lewat Cloudflare Tunnel (cloudflared),
# sehingga VPS tidak membuka port web sama sekali.
# Peta subdomain -> port sekolah ada di /etc/nginx/presensi-sekolah.map (dikelola tools/sekolah.py)

map $host $presensi_port {
    hostnames;
    default 0;
    include /etc/nginx/presensi-sekolah.map;
}

server {
    listen 127.0.0.1:8080;
    server_name _;
    client_max_body_size 16m;

    # halaman ramah bila sekolah tidak dikenal / layanan sedang dimulai ulang
    error_page 502 503 504 /_offline.html;
    location = /_offline.html {
        internal;
        default_type text/html;
        return 200 '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font-family:sans-serif;text-align:center;padding:3rem;color:#344054"><h2>Server sedang dimulai ulang</h2><p>Silakan coba lagi dalam 1 menit.</p></body>';
    }

    location / {
        if ($presensi_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$presensi_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }

    location /static/ {
        if ($presensi_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$presensi_port;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}

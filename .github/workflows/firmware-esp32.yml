# Memastikan firmware ESP32 (RFID + modul QR) bisa dikompilasi.
name: Firmware ESP32

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware-esp32.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kompilasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: MFRC522
            - name: LiquidCrystal I2C
          sketch-paths: |
            - firmware/esp32_rfid
          enable-deltas-report: false
